<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <title>Notificare achiziție pachet</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f4f4f4;
      padding: 20px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: #ffffff;
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      color: #333;
    }

    h2 {
      margin-top: 0;
      color: #222;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
    }

    .highlight {
      font-weight: bold;
      color: #c0392b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Nouă achiziție de pachet</h2>
    <p>Utilizatorul <span class="highlight">{{name}}</span> a achiziționat pachetul <span class="highlight">{{packageName}}</span>.</p>
    <p>Te rugăm să aștepți ca acest client să deschidă un ticket pe serverul de Discord înainte de a începe procesarea.</p>
    <p>Link Discord: <a href="https://discord.gg/sjMWhVyT4q" target="_blank">https://discord.gg/sjMWhVyT4q</a></p>
  </div>
</body>
</html>
